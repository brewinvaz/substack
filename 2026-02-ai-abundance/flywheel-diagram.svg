<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="stage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e5128"/>
      <stop offset="100%" style="stop-color:#0f3018"/>
    </linearGradient>
    <linearGradient id="hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#1565c0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4caf50"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="530" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="600">The Flywheel Effect</text>
  <text x="400" y="65" text-anchor="middle" fill="#a0a0a0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Systems that learn from deployment create compounding advantages</text>

  <!-- Flywheel center point at 280, 280 -->

  <!-- Curved arrows -->
  <path d="M 280 155 Q 370 155 390 230" fill="none" stroke="#4caf50" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <path d="M 405 280 Q 405 370 330 400" fill="none" stroke="#4caf50" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <path d="M 280 415 Q 190 415 160 340" fill="none" stroke="#4caf50" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <path d="M 155 280 Q 155 190 220 160" fill="none" stroke="#4caf50" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Stage 1: Deploy (top) -->
  <g transform="translate(280, 130)">
    <circle cx="0" cy="0" r="50" fill="url(#stage)" stroke="#2e7d32" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-size="24">🚀</text>
    <text x="0" y="15" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Deploy</text>
  </g>

  <!-- Stage 2: Measure (right) -->
  <g transform="translate(405, 280)">
    <circle cx="0" cy="0" r="50" fill="url(#stage)" stroke="#2e7d32" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-size="24">📏</text>
    <text x="0" y="15" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Measure</text>
  </g>

  <!-- Stage 3: Learn (bottom) -->
  <g transform="translate(280, 405)">
    <circle cx="0" cy="0" r="50" fill="url(#stage)" stroke="#2e7d32" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-size="24">🔬</text>
    <text x="0" y="15" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Learn</text>
  </g>

  <!-- Stage 4: Iterate (left) -->
  <g transform="translate(155, 280)">
    <circle cx="0" cy="0" r="50" fill="url(#stage)" stroke="#2e7d32" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" font-size="24">🔄</text>
    <text x="0" y="15" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Iterate</text>
  </g>

  <!-- Center hub -->
  <circle cx="280" cy="280" r="55" fill="url(#hub)" stroke="#42a5f5" stroke-width="3"/>
  <text x="280" y="272" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">The Closed</text>
  <text x="280" y="288" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Loop</text>
  <text x="280" y="308" text-anchor="middle" fill="#90caf9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">The Moat</text>

  <!-- Right side comparison boxes -->

  <!-- Naive approach box -->
  <rect x="520" y="120" width="240" height="150" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(150,150,150,0.3)" stroke-width="1"/>
  <circle cx="545" cy="145" r="6" fill="none" stroke="#9e9e9e" stroke-width="2"/>
  <text x="560" y="150" fill="#9e9e9e" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Naive Approach</text>

  <text x="545" y="180" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">→</text>
  <text x="560" y="180" fill="#a0a0a0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Call LLM API directly</text>

  <text x="545" y="200" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">→</text>
  <text x="560" y="200" fill="#a0a0a0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Return whatever it generates</text>

  <text x="545" y="220" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">→</text>
  <text x="560" y="220" fill="#a0a0a0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">No measurement loop</text>

  <text x="545" y="240" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">→</text>
  <text x="560" y="240" fill="#a0a0a0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Easily replicated</text>

  <!-- Flywheel approach box -->
  <rect x="520" y="290" width="240" height="170" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(46,125,50,0.5)" stroke-width="1"/>
  <circle cx="545" cy="315" r="6" fill="#81c784"/>
  <text x="560" y="320" fill="#81c784" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Flywheel Approach</text>

  <text x="545" y="350" fill="#4caf50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">→</text>
  <text x="560" y="350" fill="#a0a0a0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Deploy with learning layer</text>

  <text x="545" y="370" fill="#4caf50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">→</text>
  <text x="560" y="370" fill="#a0a0a0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Measure real outcomes</text>

  <text x="545" y="390" fill="#4caf50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">→</text>
  <text x="560" y="390" fill="#a0a0a0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Train selector OR fine-tune model</text>

  <text x="545" y="410" fill="#4caf50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">→</text>
  <text x="560" y="410" fill="#a0a0a0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Outcome data becomes moat</text>

  <text x="545" y="430" fill="#4caf50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">→</text>
  <text x="560" y="430" fill="#81c784" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Advantage compounds over time</text>

  <!-- Copyright -->
  <text x="400" y="518" text-anchor="middle" fill="#a0a0a0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">© 2026 Brewin Vaz. All rights reserved.</text>
</svg>